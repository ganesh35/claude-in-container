# Settings come from .env (see .env.example). Usage: docker compose up -d --build
services:
  claude:
    build:
      context: .
      # Value-less: passed only when set, otherwise the Dockerfile default applies
      args: [CLAUDE_CODE_VERSION]
    image: ${IMAGE:-claude-in-container:local}
    container_name: ${CONTAINER_NAME:-claude-in-container}
    hostname: ${CONTAINER_NAME:-claude-in-container}
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    # Nothing in the image needs Linux capabilities or setuid escalation; drop both
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Same names as CONTAINER_ENV in scripts/lib.sh; unset ones are not passed
    environment:
      [REMOTE_CONTROL_NAME, REMOTE_CONTROL_MODE, ANTHROPIC_API_KEY, CONTINUE, GH_VERSION, YQ_VERSION, JQ_VERSION,
       TERRAFORM_VERSION, AWSCLI_VERSION, NPM_TOOLS, UV_TOOLS]
    volumes:
      # The single mount; fail fast if missing, since Docker would create it root-owned and unwritable for Claude
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        bind: { create_host_path: false }
